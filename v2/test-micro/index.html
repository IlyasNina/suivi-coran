<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essai micro</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:20px 16px;background:#faf6ea;color:#1c2b26;max-width:520px;margin-inline:auto}
h1{font-size:1.2rem;margin:0 0 4px}p{margin:6px 0}.s{color:#5b6b64;font-size:.9rem}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:#0e6b5c;color:#fff;width:100%;margin:10px 0;min-height:52px}
button:disabled{opacity:.5}button.rec{background:#b3261e}
#out{direction:rtl;font-family:'KFGQPC Hafs','Scheherazade New',serif;font-size:1.5rem;line-height:2.1;background:#fff;border:1px solid #e3dccb;border-radius:12px;padding:12px;min-height:60px;margin-top:8px}
#log{white-space:pre-wrap;font-size:.8rem;color:#5b6b64;margin-top:10px}
progress{width:100%}
</style></head><body>
<h1>Essai micro — Suivi mouraja’a</h1>
<p class="s">Page d’essai, séparée de l’appli. Le modèle (environ 19 Mo) se télécharge une fois, puis reste sur le téléphone. Ton audio ne quitte pas l’appareil.</p>
<button id="load">1. Charger le modèle</button>
<button id="rec" disabled>2. Réciter (appuie, récite, réappuie)</button>
<p class="s">Résultat compris par le modèle (sans voyelles) :</p>
<div id="out" lang="ar"></div>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id), log=(m)=>{$('log').textContent+=m+'\n'};
const BASE='https://huggingface.co/Abdou/quran-asr-tiny/resolve/main/';
let sess,T2=[];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script '+src));document.head.appendChild(s);});}
async function getBuf(name,asText){
  const url=BASE+name;let cache=null;try{cache=await caches.open('asr-tiny-v1');}catch(e){}
  if(cache){const hit=await cache.match(url);if(hit)return asText?hit.text():hit.arrayBuffer();}
  const r=await fetch(url);if(!cache)return asText?r.text():r.arrayBuffer();
  await cache.put(url,r);const hit=await cache.match(url);return asText?hit.text():hit.arrayBuffer();
}
$('load').onclick=async()=>{
  $('load').disabled=true;const t0=performance.now();
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.js');
    ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/';
    const tok=await getBuf('tokens.txt',true);
    tok.split('\n').filter(Boolean).forEach(l=>{const i=l.lastIndexOf(' ');T2[+l.slice(i+1)]=l.slice(0,i);});
    const buf=await getBuf('model.int8.onnx',false);
    sess=await ort.InferenceSession.create(new Uint8Array(buf),{executionProviders:['wasm'],graphOptimizationLevel:'basic'});
    log('Modèle prêt en '+Math.round((performance.now()-t0)/1000)+' s');
    $('rec').disabled=false;$('load').textContent='Modèle chargé ✓';
  }catch(e){log('Erreur : '+e.message);$('load').disabled=false;}
};
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len;const wr=Math.cos(ang),wi=Math.sin(ang);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=i+k+len/2;const tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr;}}}}
const kBanks=(()=>{const mel=f=>1127*Math.log(1+f/700);const lowM=mel(20),highM=mel(8000-400),delta=(highM-lowM)/81,w=16000/512;const B=[];for(let b=0;b<80;b++){const l=lowM+b*delta,c=lowM+(b+1)*delta,r=lowM+(b+2)*delta;const row=new Float32Array(256);for(let i=0;i<256;i++){const m=mel(w*i);if(l<m&&m<r)row[i]=m<=c?(m-l)/(c-l):(r-m)/(r-c);}B.push(row);}return B;})();
const kWin=(()=>{const w=new Float32Array(400);for(let n=0;n<400;n++)w[n]=Math.pow(0.5-0.5*Math.cos(2*Math.PI*n/399),0.85);return w;})();
function kfbank(x){const N=x.length;const T=Math.floor((N+80)/160);const F=new Float32Array(T*80);const re=new Float64Array(512),im=new Float64Array(512);const fr=new Float64Array(400);const eps=1.1920929e-7;
for(let t=0;t<T;t++){let mean=0;for(let j=0;j<400;j++){let i=t*160+80-200+j;if(i<0)i=-i-1;if(i>=N)i=2*N-1-i;i=Math.max(0,Math.min(N-1,i));fr[j]=x[i];mean+=fr[j];}mean/=400;for(let j=0;j<400;j++)fr[j]-=mean;
re.fill(0);im.fill(0);re[0]=fr[0]*(1-0.97)*kWin[0];for(let j=1;j<400;j++)re[j]=(fr[j]-0.97*fr[j-1])*kWin[j];
fft(re,im);const p=new Float32Array(256);for(let k=0;k<256;k++)p[k]=re[k]*re[k]+im[k]*im[k];
for(let m=0;m<80;m++){let s=0;const row=kBanks[m];for(let k=0;k<256;k++)s+=row[k]*p[k];F[t*80+m]=Math.log(Math.max(s,eps));}}
return {F,T};}
async function transcribe(pcm){const t0=performance.now();const {F,T}=kfbank(pcm);
const o=await sess.run({x:new ort.Tensor('float32',F,[1,T,80]),x_lens:new ort.Tensor('int64',BigInt64Array.from([BigInt(T)]),[1])});
const lp=o.log_probs;const TT=lp.dims[1],V=lp.dims[2];const len=Number(o.log_probs_len.data[0]);const d=lp.data;let prev=-1;const out=[];
for(let t=0;t<Math.min(len,TT);t++){let bi=0,bv=-1e9;for(let v=0;v<V;v++){const q=d[t*V+v];if(q>bv){bv=q;bi=v;}}if(bi!==prev&&bi!==0)out.push(T2[bi]);prev=bi;}
return {text:out.join('').replace(/▁/g,' ').trim(),ms:Math.round(performance.now()-t0),sec:pcm.length/16000};}
/* --- micro --- */
let mr=null,chunks=[],stream=null,timer=null;
$('rec').onclick=async()=>{
  if(mr&&mr.state==='recording'){mr.stop();return;}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});}
  catch(e){log('Micro refusé ou indisponible : '+e.message+' (ouvre la page dans Safari, pas dans une fenêtre intégrée)');return;}
  chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=async()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());$('rec').classList.remove('rec');$('rec').textContent='Analyse en cours…';$('rec').disabled=true;
    try{const ab=await new Blob(chunks,{type:mr.mimeType}).arrayBuffer();const ac=new (window.AudioContext||window.webkitAudioContext)();const buf=await ac.decodeAudioData(ab);
      const len=Math.ceil(buf.duration*16000);const oc=new OfflineAudioContext(1,len,16000);const s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start();const pcm=(await oc.startRendering()).getChannelData(0);
      const r=await transcribe(pcm);$('out').textContent=r.text||'(rien compris)';log('Audio '+r.sec.toFixed(1)+' s · analysé en '+(r.ms/1000).toFixed(1)+' s');}
    catch(e){log('Erreur : '+e.message);}
    $('rec').disabled=false;$('rec').textContent='2. Réciter (appuie, récite, réappuie)';};
  mr.start();$('rec').classList.add('rec');$('rec').textContent='■ Arrêter';timer=setTimeout(()=>{if(mr.state==='recording')mr.stop();},60000);
};
</script></body></html>
