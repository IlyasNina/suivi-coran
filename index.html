<!doctype html><html data-theme="light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Suivi du Coran</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700&display=swap">
<style>
/* Concept : un carnet de hifz. Un écran d'accueil à deux grands boutons, puis pour chaque profil
   un suivi par couleurs, des pages du mushaf en tajwid, et un plan de révision qui suit l'ordre du mushaf, du mardi au dimanche. */
:root{
  --bg:#FAF6EC;
  --surface:#FFFFFF;
  --ink:#14211D;
  --muted:#5A6B65;
  --line:#E6DECB;
  --soft:#F1EBDA;--dash:#CFCABB;
  --accent:#0E6B5C;
  --accent-ink:#FFFFFF;
  --n-bg:#E7E1CF; --n-fg:#4A5852;
  --v-bg:#2F7D3A; --v-fg:#FFFFFF;
  --o-bg:#B85A0B; --o-fg:#FFFFFF;
  --r-bg:#B3261E; --r-fg:#FFFFFF;
  --b-bg:#BFE4F8; --b-fg:#0B3550; --b-ink:#1B5A82; --b-line:#7DBCE3; --o-ink:#8A4308;
  --lp-bg:#D6EBE4; --lp-ink:#0A4A40; --lp-soft:#9CCDC0; --f-title:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-ar:'Scheherazade New','Amiri Quran','Traditional Arabic',serif;
  --f-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bar-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1613;--surface:#15211D;--ink:#E7EFEB;--muted:#9BAEA7;--line:#263832;--soft:#1B2A25;--dash:#3A4944;
  --accent:#5CC9AF;--accent-ink:#06211B;
  --n-bg:#26352F;--n-fg:#A9BBB4;
  --v-bg:#5CC06C;--v-fg:#07200E;
  --o-bg:#F0A04B;--o-fg:#2B1700;
  --r-bg:#F27B72;--r-fg:#330805;
  --b-bg:#AEDBF3;--b-fg:#08293F;--b-ink:#AEDBF3;--b-line:#5E94B8;--o-ink:#F0A04B;
  --lp-bg:#1B3B34;--lp-ink:#BFE8DC;--lp-soft:#2F5A50;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1613;--surface:#15211D;--ink:#E7EFEB;--muted:#9BAEA7;--line:#263832;--soft:#1B2A25;--dash:#3A4944;
  --accent:#5CC9AF;--accent-ink:#06211B;
  --n-bg:#26352F;--n-fg:#A9BBB4;
  --v-bg:#5CC06C;--v-fg:#07200E;
  --o-bg:#F0A04B;--o-fg:#2B1700;
  --r-bg:#F27B72;--r-fg:#330805;
  --b-bg:#AEDBF3;--b-fg:#08293F;--b-ink:#AEDBF3;--b-line:#5E94B8;--o-ink:#F0A04B;
  --lp-bg:#1B3B34;--lp-ink:#BFE8DC;--lp-soft:#2F5A50;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:640px;margin:0 auto}

.st-n{background:var(--n-bg);color:var(--n-fg)}
.st-v{background:var(--v-bg);color:var(--v-fg)}
.st-o{background:var(--o-bg);color:var(--o-fg)}
.st-b{background:var(--b-bg);color:var(--b-fg)}
.sy{display:inline-block;width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.lvdef{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lvdef li{color:var(--muted);font-size:.9rem}
.lvdef b{color:var(--ink)}
.subbox{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.subbox h5{margin:0;font-size:.95rem}
.loopload{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--ink)!important}
.loopload.heavy{border:1.5px solid var(--o-bg)}
select.field{font:inherit;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.loopbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;font-weight:700;margin:14px 0 4px;text-align:left}
.loopbtn small{color:var(--muted);font-weight:500;font-size:.85rem}
.loopinfo{color:var(--muted);font-size:.82rem;margin:2px 0 8px}
.lvrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px;margin-top:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.lvlist{margin-top:4px}
.acc>.ab .lvrow{background:var(--bg)}
.lvrow .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem}
.lvrow .nm span{color:var(--muted);font-family:var(--f-ar);font-size:1.05rem}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lv button{min-height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;font-size:.76rem;font-weight:600;padding:2px}
.lv button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lvall{padding:0 0 10px}
.lvall .nm{font-size:.82rem;color:var(--muted);margin-bottom:6px}
.setcard input[type=number]{width:96px}

/* Accueil */
.home{padding-top:44px;display:flex;flex-direction:column;gap:28px}
.bism{font-family:var(--f-ar);font-size:1.9rem;line-height:1.6;text-align:center;direction:rtl;color:var(--accent);margin-bottom:26px}
.home h1{font-size:2rem;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-align:center;text-wrap:balance}
.home .lead{text-align:center;color:var(--muted);margin-top:6px}
.profiles{display:grid;gap:14px}
.pcard{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px 20px;min-height:0}
.pcard:hover{border-color:var(--accent)}
.pcard .nm{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.pcard .meta{color:var(--muted);font-size:.92rem}
.prow{display:flex;align-items:center;gap:14px;min-width:0}
.av{width:56px;height:56px;border-radius:50%;flex:none;display:block}
.avpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avopt{border:3px solid transparent;border-radius:50%;padding:2px;background:none;aspect-ratio:1;min-width:0}
.avopt img{width:100%;height:100%;display:block;border-radius:50%}
.avopt[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface) inset}
.avopt[aria-pressed=false]{opacity:.85}
.pcard .today{font-weight:600;font-size:.95rem}
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--n-bg)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px}

/* Cartes d'ajout et pastille enfant */
.pcard.add{border:1px dashed var(--dash);background:transparent;min-height:0;gap:6px;padding:18px 20px}
.pcard.add:hover{border-color:var(--accent)}
.pcard.add .nm{font-size:1.2rem;color:var(--accent);display:flex;align-items:center;gap:10px}
.pcard.add .plus{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent)}
.pcard.add .plus svg{width:16px;height:16px;display:block;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round}
.kindtag{margin-left:10px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--muted);vertical-align:middle}
.note{color:var(--muted);font-size:.9rem}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);height:var(--bar-h);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.back{border:0;background:none;min-width:44px;min-height:44px;font-size:1.6rem;line-height:1;margin-left:-10px;color:var(--accent)}
.top h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.gear{border:0;background:none;min-width:44px;min-height:44px;margin-right:-10px;color:var(--accent);display:inline-flex;align-items:center;justify-content:center}
.gear svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.credit{margin:34px 0 0;text-align:center;font-size:.78rem;color:var(--muted)}

/* Pinceau */
.brushbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h));z-index:25;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.brushes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.brush{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:12px;border:2.5px solid transparent;padding:4px 2px;font-weight:700;font-size:.8rem;line-height:1.15;text-align:center}
.brush b{font-size:1.15rem;line-height:1}
.brush[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.brush[aria-pressed=false]{opacity:.78}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;font-size:.85rem;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0;min-height:40px;text-decoration:underline}
.link:disabled{opacity:.4;text-decoration:none}
.link.danger{color:var(--r-bg)}
.msg{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--accent);font-size:.9rem}
.addbtn{width:100%;margin-top:12px;border:1px dashed var(--dash);background:transparent;color:var(--accent);border-radius:14px;min-height:50px;font-weight:700}
.addbtn:hover{border-color:var(--accent)}

/* Encadrés qui se déplient */
.acc{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.acc>.ah{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;text-align:left;border:0;background:transparent;padding:14px 16px;min-height:64px}
.acc .at{font-size:1.1rem;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.acc .ac{font-size:.85rem;color:var(--muted);font-weight:500}
.acc .chev{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.acc[data-open="1"] .chev{transform:rotate(180deg)}
.acc .abar{grid-column:1 / -1;height:8px}
.acc>.ab{padding:14px 16px 16px;border-top:1px solid var(--line)}
.acc .panel{background:var(--bg)}
.ph{list-style:none;font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 4px 0}
.block{margin-top:20px}
.block>.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.block h3{font-size:1.1rem;font-weight:700}
.block .cnt{font-size:.85rem;color:var(--muted)}
.remrow{margin-top:8px;font-size:.78rem}
.remrow .link,.remline .link{font-size:.78rem;font-weight:500;min-height:32px}
.remask{display:inline-flex;gap:12px;align-items:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:56px;border:0;border-radius:12px;font-weight:700;font-size:1.05rem;line-height:1.1;font-variant-numeric:tabular-nums}
.cell small{font-size:.8rem;font-weight:700;opacity:.9}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-top:12px}
.panel>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.panel[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.rangeform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding-bottom:14px}
.rangeform label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.rangeform input,.field{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.rangeform input{width:96px;font-size:1rem}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rows{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.row{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;min-height:60px}
.row .sw{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;font-weight:700;font-size:1.2rem}
.row .tx{min-width:0}
.row .tx b{display:block;font-size:1rem;line-height:1.25}
.row .tx span{font-size:.82rem;color:var(--muted)}
.row .ar{font-family:var(--f-ar);font-size:1.5rem;line-height:1.3;direction:rtl}
.rowwrap{display:flex;flex-direction:column}
.rowwrap .remline{padding-left:8px;font-size:.78rem}
.row.pick .sw{background:var(--soft);color:var(--ink);font-size:.95rem;font-variant-numeric:tabular-nums}

/* Mouraja'a */
.weekhead{margin-top:16px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.weekhead h3{font-size:1.1rem}
.weekhead span{font-size:.85rem;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;padding:6px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.dbtn small{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dbtn .num{font-size:1.1rem;font-variant-numeric:tabular-nums}
.dbtn .mk{font-size:.8rem;min-height:1em;color:var(--v-bg);font-weight:700;line-height:1}
.dbtn.rest{background:transparent;border-style:dashed}
.dbtn.today{border-color:var(--accent);border-width:2.5px}
.dbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dbtn[aria-pressed=true] small,.dbtn[aria-pressed=true] .mk{color:var(--accent-ink)}
.daytitle{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.daytitle h3{font-size:1.25rem;text-transform:capitalize}
.tag{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.card h4{margin:0;font-size:1rem}
.card .sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card .sh span{font-size:.85rem;color:var(--muted)}
.rl{font-size:1.05rem;line-height:1.45}
.rl b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:99px;min-height:30px}
.det>summary{cursor:pointer;color:var(--accent);font-weight:700;min-height:40px;display:flex;align-items:center}
.det .chips{margin-top:6px}
.donebtn{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:12px;min-height:48px;font-weight:700;padding:8px 14px}
.donebtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.empty{margin-top:14px;padding:22px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.overview{margin-top:26px}
.overview h3{font-size:1.05rem;margin-bottom:10px}
.ov{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;min-height:52px}
.ov .d{font-weight:700;font-size:.9rem;text-transform:capitalize}
.ov .s{font-size:.88rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.ov .c{font-weight:700;color:var(--v-bg)}
.ov[aria-pressed=true]{border-color:var(--accent);border-width:2px}
/* Mouraja'a : bandeau de boucle, semaine à plat, journée en chronologie */
.loopban{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:var(--lp-bg);color:var(--lp-ink);border:0;border-radius:16px;padding:14px 16px;margin-top:14px}
.loopban .lt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.loopban .lt b{font-family:var(--f-title);font-size:1.35rem;font-weight:700}
.loopban .go{font-size:.88rem;font-weight:700;border:1.5px solid var(--lp-ink);border-radius:99px;padding:4px 14px}
.loopban .lm{font-size:.95rem}
.loopban .lx{font-size:.82rem;opacity:.85}
.lpbar{display:flex;gap:4px}
.lpbar i{flex:1;height:6px;border-radius:9px;background:var(--lp-soft)}
.lpbar i.on{background:var(--lp-ink)}
.weekbox{margin-top:16px;border-top:1px solid var(--dash);border-bottom:1px solid var(--dash);padding:12px 0}
.weekbox .weekhead{margin-top:0}
.weekhead h3,.daytitle h3,.overview h3{font-family:var(--f-title);font-weight:700}
.dbtn{border:0;background:transparent;min-height:68px}
.dbtn.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border:0;box-shadow:none}
.dbtn[aria-pressed=true] small,.dbtn[aria-pressed=true] .mk{color:var(--accent-ink)}
.dbtn .mk{color:var(--accent)}
.daytitle h3{font-size:1.5rem}
.tl{margin-top:12px;display:flex;flex-direction:column}
.tl-sec{display:grid;grid-template-columns:34px 1fr;column-gap:10px}
.tl-rail{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:34px;height:34px;border-radius:99px;margin-top:0;display:flex;align-items:center;justify-content:center;flex:none;font-size:1rem;box-sizing:border-box;background:transparent;border:3px solid var(--dc);color:transparent;padding:0}
.tl-dot.on{background:var(--v-bg);border-color:var(--v-bg);color:var(--v-fg)}
.tl-v{--dc:var(--v-bg)}
.tl-o{--dc:var(--o-bg)}
.tl-b{--dc:var(--b-line)}
.bl{margin:6px 0 0;padding-left:20px}
.bl li{font-size:1.05rem;margin:3px 0}
.bl li::marker{color:var(--muted)}
.bh{margin:8px 0 0;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.finish{margin-top:14px;border:2px solid var(--line);color:var(--muted);border-radius:14px;min-height:50px;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center}
.finish.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.finhint{font-size:.82rem;color:var(--muted);text-align:center;margin-top:6px}
.tl-line{flex-grow:1;width:3px;background:var(--dash);margin-top:4px;border-radius:2px}
.tl-body{padding-bottom:22px;min-width:0}
.tl-sec:last-child .tl-body{padding-bottom:4px}
.tl-body h4{font-family:var(--f-title);font-size:1.2rem;font-weight:700;margin:0}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tl-head span{font-size:.85rem;color:var(--muted)}
.tl-body .rl b{display:inline;font-size:1rem;text-transform:none;letter-spacing:0;color:var(--ink)}

.tl-b h4{color:var(--b-ink)}

.overview .ov{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:0;padding:10px 4px}

.setcard h4{font-size:1rem}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}

.stepper .ctl{display:flex;align-items:center;gap:8px}

.flash{font-size:.88rem;font-weight:600;color:var(--accent)}

.notice p{margin:0}
.setcard .meta{font-size:.85rem;color:var(--muted);margin:0}
.steps{margin:8px 0 0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.steps li{margin-bottom:6px}
.btn.warn{border-color:var(--r-bg);color:var(--r-bg)}
.btn.warnfill{background:var(--r-bg);border-color:var(--r-bg);color:var(--r-fg)}
.row2{display:flex;flex-wrap:wrap;gap:10px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);

function trackedFor(pk,extra){
  const set=new Set(BASE);
  for(let n=78;n<=114;n++) set.add(n);
  (extra||[]).forEach(n=>set.add(n));
  return Array.from(set).sort((a,b)=>a-b);
}
function buildItems(pk,extra){
  const a=[];
  trackedFor(pk,extra).forEach(n=>{
    const s=SUR[n-1];
    if(modeOf(n)==='pages'){ for(let p=s.p;p<=lastPage(n);p++) a.push({kind:'b',id:'b'+p,p:p,sn:n}); }
    else a.push({kind:'s',id:'s'+n,n:n,ar:s.ar,fr:s.fr,p:s.p,sn:n});
  });

}

function sanitize(o){
  const s=defaults();
  if(!o||typeof o!=='object') return s;
  if(o.settings&&typeof o.settings==='object'){
    s.settings.fo=clamp(Math.round(+o.settings.fo)||2,1,6);
    s.settings.fb=clamp(Math.round(+(o.settings.fb!=null?o.settings.fb:o.settings.fn))||4,1,6);
    s.settings.fd=clamp(Math.round(+o.settings.fd)||7,3,21);
    s.settings.res=clamp(Math.round(+o.settings.res)||3,2,6);
  }
  const src=o.profiles&&typeof o.profiles==='object'?o.profiles:{};
  const order=Array.isArray(o.order)?o.order:Object.keys(src);
  order.forEach(id=>{
    if(typeof id!=='string'||!/^p[a-z0-9]{3,24}$/.test(id)||s.profiles[id]||s.order.length>=MAX_PROFILES) return;
    const p=src[id]; if(!p||typeof p!=='object') return;
    const q={name:String(p.name||'').replace(/\s+/g,' ').trim().slice(0,24)||'Profil',kind:p.kind==='child'?'child':'adult',avatar:(typeof p.avatar==='string'&&AVKEYS.indexOf(p.avatar)>=0)?p.avatar:'',marks:{},done:{},fresh:{},extra:[],loop:{n:7,start:LOOP_START},levels:{}};
    if(Array.isArray(p.extra)){
      const base=new Set(trackedFor(id,[]));
      p.extra.forEach(v=>{ const n=Math.round(+v); if(n>=1&&n<=114&&!base.has(n)&&q.extra.indexOf(n)<0) q.extra.push(n); });
      q.extra.sort((a,b)=>a-b);
    }
    const valid=new Set(buildItems(id,q.extra).map(i=>i.id));
    if(p.marks&&typeof p.marks==='object'){
      for(const k of Object.keys(p.marks)){
        const v=p.marks[k];
        if(!valid.has(k)) continue;
        if(v==='v'||v==='o'||v==='b') q.marks[k]=v; else if(v==='r') q.marks[k]='o';
      }
    }
    if(p.fresh&&typeof p.fresh==='object'){
      for(const k of Object.keys(p.fresh)){
        const t=+p.fresh[k]; if(!(t>0&&isFinite(t))) continue;
        if(q.marks[k]==='b') q.fresh[k]=t;
        else if(q.marks[k]==='v'&&Date.now()-t<s.settings.fd*86400000){ q.marks[k]='b'; q.fresh[k]=t; }
      }
    }
    if(p.loop&&typeof p.loop==='object'){
      const nn=Math.round(+p.loop.n); if(nn>=3&&nn<=60) q.loop.n=nn;
      if(/^\d{4}-\d{2}-\d{2}$/.test(String(p.loop.start||''))) q.loop.start=p.loop.start;
      if(p.loop.cd!=null&&p.loop.cd!==''&&Math.round(+p.loop.cd)>=0&&Math.round(+p.loop.cd)<=6) q.loop.cd=Math.round(+p.loop.cd);
    }
    if(p.levels&&typeof p.levels==='object'){
      for(const k of Object.keys(p.levels)){ const n=Math.round(+k), l=p.levels[k]; if(n>=1&&n<=114&&(l==='p'||l==='r'||l==='x')) q.levels[n]=l; }
    }
    if(p.done&&typeof p.done==='object'){
      for(const wk of Object.keys(p.done)){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(wk)||!p.done[wk]||typeof p.done[wk]!=='object') continue;
        for(const d of Object.keys(p.done[wk])){
          const v=p.done[wk][d];
          if(!/^[0-6]$/.test(d)||!v||typeof v!=='object') continue;
          (q.done[wk]=q.done[wk]||{})[d]={b:v.b?1:0,r:v.r?1:0,p:v.p?1:0};
        }
      }
    }
    s.profiles[id]=q; s.order.push(id);
  });

  s.createdAt=+o.createdAt>0?+o.createdAt:0; s.backupAt=+o.backupAt>0?+o.backupAt:0;

}

function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }

/* ---------- Plan de mouraja'a ---------- */
function combos(arr,k){
  const out=[];
  (function rec(start,cur){
    if(cur.length===k){ out.push(cur.slice()); return; }
    for(let i=start;i<arr.length;i++){ cur.push(arr[i]); rec(i+1,cur); cur.pop(); }
  })(0,[]);
  return out;
}
function adjacency(days){
  const s=days.slice().sort((a,b)=>a-b); let c=0;
  for(let i=1;i<s.length;i++) if(s[i]-s[i-1]===1) c++;
  return c;
}
function dayNum(d){ return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); }
function startNum(P){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String((P.loop&&P.loop.start)||LOOP_START))||[0,2024,1,1];
  return Math.round(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5);
}
function levelOf(P,sn){ return (P.levels&&P.levels[sn])||'n'; }
/* Un bleu devient vert tout seul après le délai (7 jours par défaut). */
function settleBlue(){
  let ch=false; const lim=state.settings.fd*86400000, now=Date.now();
  for(const k of state.order){
    const P=state.profiles[k]; P.fresh=P.fresh||{};
    for(const id of Object.keys(P.marks)){
      if(P.marks[id]!=='b') continue;
      const t=P.fresh[id];
      if(!(t>0)||now-t>=lim){ P.marks[id]='v'; delete P.fresh[id]; ch=true; }
    }
  }
  return ch;
}
/* Poids d'un élément, en pages : une page = 1 ; une sourate = sa part de page (les petites sourates de Juzz Amma pèsent peu). */
let _sw=null;
function surW(n){
  if(!_sw){ _sw={}; let i=0;
    while(i<114){ const P=SUR[i].p; let j=i; while(j<114&&SUR[j].p===P) j++;
      const Q=j<114?SUR[j].p:605, w=Math.max(Q-P,1)/(j-i); for(let t=i;t<j;t++) _sw[t+1]=w; i=j; } }
  return _sw[n]||1;
}
function itemW(it){ return it.kind==='b'?1:surW(it.n); }
/* Une boucle = N jours consécutifs. Tout ce qui est appris y est repassé une fois, dans l'ordre du mushaf,
   en répartissant le travail à parts égales en pages. Les passages à retravailler sont répétés en plus. */
function buildCycle(pk,k){
  const P=state.profiles[pk], N=P.loop.n, marks=P.marks, st=state.settings;
  const s0=startNum(P)+k*N, dates=[];
  for(let j=0;j<N;j++) dates.push(s0+j);
  const m=dates.length, days=Array.from({length:m},()=>({block:[],reinf:[],prio:[]}));
  if(!m) return {dates:dates,days:days};
  const R=st.res;
  const L=itemsFor(pk).filter(it=>{
    if(!marks[it.id]) return false;
    const lv=levelOf(P,it.sn);
    if(lv==='x') return false;
    if(lv==='r') return ((((k+it.sn)%R)+R)%R)===0;
    return true;
  });
  const order={}; L.forEach((it,i)=>order[it.id]=i);
  const baseDay={};
  /* Chaque jour prend une part de chaque ensemble (chaque sourate à pages, chaque juz, les autres sourates),
     toujours dans l'ordre du mushaf : on avance un peu partout, sans passer des jours entiers sur un seul bloc. */
  const trSet=new Set(trackedFor(pk,P.extra)), fullJ=new Set(JUZ.filter(j=>juzRange(j).every(n=>trSet.has(n))).map(j=>j.id));
  const gkey=it=>{ if(it.kind==='b') return 's'+it.sn; const j=juzOf(it.n); return (j&&fullJ.has(j.id))?'j'+j.id:'o'; };
  const groups={}; L.forEach(it=>{ (groups[gkey(it)]=groups[gkey(it)]||[]).push(it); });
  const daysOf={};
  Object.keys(groups).forEach(g=>{
    const arr=groups[g];
    /* une sourate prioritaire fait deux tours dans la boucle, chacun dans l'ordre */
    const seq=arr.concat(arr.filter(it=>levelOf(P,it.sn)==='p'));
    const Wg=seq.reduce((a,it)=>a+itemW(it),0); let cum=0;
    seq.forEach(it=>{
      const w=itemW(it), d=clamp(Math.floor((cum+w/2)/Wg*m),0,m-1);
      if(!days[d].block.some(x=>x.id===it.id)){ days[d].block.push(it); (daysOf[it.id]=daysOf[it.id]||[]).push(d); }
      cum+=w;
    });
  });
  const Wtot=L.reduce((a,it)=>a+itemW(it)*(levelOf(P,it.sn)==='p'?2:1),0), cap=Math.max(4,Math.ceil(Wtot/m*0.75));
  const rload=new Array(m).fill(0);
  const pri=it=>levelOf(P,it.sn)==='p'?0:1, kind=it=>marks[it.id]==='o'?0:marks[it.id]==='b'?1:2;
  /* À revoir en plus : le orange, le bleu, et toute la sourate prioritaire (même en vert). */
  const weak=L.filter(it=>marks[it.id]==='o'||marks[it.id]==='b').sort((a,b)=>pri(a)-pri(b)||kind(a)-kind(b)||order[a.id]-order[b.id]);
  const load=new Array(m).fill(0);
  for(const it of weak){
    const f=kind(it)===2?2:(kind(it)===0?st.fo:st.fb)+(pri(it)===0?1:0);
    const passes=kind(it)===1?m:clamp(Math.round(f*N/7),1,m), extra=passes-1;
    if(extra<=0) continue;
    const dd=daysOf[it.id]||[0], b=dd[0], used=new Set(dd);
    for(let j=1;j<=extra;j++){
      const ideal=(b+Math.round(j*m/(extra+1)))%m;
      let best=-1,bs=Infinity;
      for(const off of [0,1,-1,2,-2,3,-3]){
        const c=((ideal+off)%m+m)%m; if(used.has(c)||(kind(it)!==1&&rload[c]>=cap)) continue;
        const sc=load[c]*10+Math.abs(off); if(sc<bs){ bs=sc; best=c; }
      }
      if(best<0){ for(let c=0;c<m;c++){ if(!used.has(c)&&(kind(it)===1||rload[c]<cap)&&load[c]<bs){ bs=load[c]; best=c; } } }
      if(best<0) break;
      used.add(best); load[best]+=itemW(it); rload[best]+=itemW(it); (kind(it)===2?days[best].prio:days[best].reinf).push(it);
    }
  }
  days.forEach(d=>{ d.reinf.sort((a,b)=>pri(a)-pri(b)||kind(a)-kind(b)||order[a.id]-order[b.id]); d.prio.sort((a,b)=>order[a.id]-order[b.id]); });
  return {dates:dates,days:days};
}
/* Les sept jours de la semaine qui commence à `monday`. */
function weekPlan(pk,monday){
  const P=state.profiles[pk], N=P.loop.n, sn=startNum(P), cyc={}, out=[];
  for(let wd=0;wd<=6;wd++){
    const dn=dayNum(addDays(monday,wd)), k=Math.floor((dn-sn)/N);
    const c=cyc[k]||(cyc[k]=buildCycle(pk,k)), i=c.dates.indexOf(dn);
    out.push(i>=0?{block:c.days[i].block,reinf:c.days[i].reinf,prio:c.days[i].prio,idx:i,m:c.dates.length}:{block:[],reinf:[],prio:[],idx:-1,m:0});
  }
  return out;
}
function ranges(a){
  const out=[]; let s=a[0],p=a[0];
  for(let i=1;i<a.length;i++){
    if(a[i]===p+1){ p=a[i]; continue; }
    out.push(s===p?''+s:s+'–'+p); s=p=a[i];
  }
  out.push(s===p?''+s:s+'–'+p);
  return out.join(', ');
}
function runsOf(items){
  const runs=[]; let cur=null;

    const key=it.kind==='b'?'b'+it.sn:'s';
    if(cur&&cur.key===key) cur.items.push(it); else { cur={key:key,items:[it]}; runs.push(cur); }
  });
  return runs;
}

function daySecs(pk,d){

    if(r.items[0].kind==='b'){ const rg=ranges(r.items.map(i=>i.p)); return `<ul class="bl"><li>${esc(SUR[r.items[0].sn-1].fr)} p. ${rg}</li></ul>`; }
    const l=runLabel(r.items);
    return (l!=='Sourates'?`<p class="bh">${esc(l)}</p>`:'')+`<ul class="bl">${r.items.map(x=>`<li>${esc(x.fr)}</li>`).join('')}</ul>`;
  }).join('');
}
function tlSec(cls,sym,sec,done,title,sub,body,last){
  return `<div class="tl-sec ${cls}"><div class="tl-rail"><button class="tl-dot${done?' on':''}" data-act="done" data-sec="${sec}" aria-pressed="${done?'true':'false'}" aria-label="${esc(title)} : ${done?'fait':'à faire'}">${sym}</button>${last?'':'<span class="tl-line"></span>'}</div>
    <div class="tl-body"><div class="tl-head"><h4>${title}</h4>${sub?`<span>${sub}</span>`:''}</div>${body}</div></div>`;
}
function planHTML(){
  const monday=mondayOf(new Date()), tw=todayWd(), plan=weekPlan(pk,monday), P=state.profiles[pk], PL=P.loop, CD=PL.cd==null?-1:PL.cd;
  const learned=counts(pk); const nLearned=learned.v+learned.o+learned.b;
  const doneDays=plan.reduce((a,d,i)=>a+(dayComplete(pk,i,d)?1:0),0);
  const activeDays=plan.filter(d=>d.block.length||d.reinf.length||d.prio.length).length;
  let h=loopBanner(P);
  h+=`<div class="weekbox"><div class="weekhead"><h3>Semaine du ${fmtShort.format(monday)}</h3><span>${doneDays} jour${doneDays>1?'s':''} fait${doneDays>1?'s':''} sur ${activeDays||7}</span></div>`;
  h+=`<div class="days" role="group" aria-label="Jours de la semaine">`+DAYS_SHORT.map((n,i)=>{
    const d=addDays(monday,i);
    const done=dayComplete(pk,i,plan[i]);
    return `<button class="dbtn${i===tw?' today':''}" data-act="day" data-d="${i}" aria-pressed="${selDay===i}" aria-label="${DAYS_LONG[i]} ${d.getDate()}"><small>${n}</small><span class="num">${d.getDate()}</span><span class="mk">${done?'✓':(i===CD?'cours':'')}</span></button>`;
  }).join('')+`</div></div>`;
  const date=addDays(monday,selDay);
  h+=`<div class="daytitle"><h3>${fmtDay.format(date)}</h3>${selDay===tw?'<span class="tag">Aujourd’hui</span>':''}${selDay===CD?'<span class="tag">Jour du cours</span>':''}</div>`;
  if(!nLearned){
    h+=`<div class="empty"><p>Aucune page ni sourate n’est encore colorée.<br>Marque ce qui est appris pour que le plan se construise.</p><button class="btn primary" data-act="tab" data-tab="suivi">Aller au suivi</button></div>`;
  } else {
    const d=plan[selDay], dn=doneOf(pk,selDay);
    const sc=daySecs(pk,d), oranges=sc.oranges, blues=sc.blues, secs=[];
    if(d.block.length) secs.push(['tl-v',SYCHK,'b','Révision du jour','',bulletLines(d.block),dn.b]);
    if(oranges.length) secs.push(['tl-o',SYCHK,'r','Passages à consolider','',`<ul class="bl">${oranges.map(it=>`<li>${esc(itemLabel(it))}</li>`).join('')}</ul>`,dn.r]);
    if(blues.length) secs.push(['tl-b',SYCHK,'p','Nouvelle(s) page(s)','',`<ul class="bl">${blues.map(it=>`<li>${esc(itemLabel(it))}</li>`).join('')}</ul>`,dn.p]);
    if(!secs.length){
      h+=`<div class="card"><p>Rien au plan ce jour-là : il n’y a pas assez d’éléments appris pour remplir tous les jours de la boucle, ou ils sont exclus ou résiduels dans « Ma boucle ».</p></div>`;
    } else {
      h+=`<div class="tl">`+secs.map((x,i)=>tlSec(x[0],x[1],x[2],!!x[6],x[3],x[4],x[5],i===secs.length-1)).join('')+`</div>`;
      const fin=dayComplete(pk,selDay,d);
      h+=`<div class="finish${fin?' on':''}" role="status">${fin?'Mouraja’a terminée ✓':'J’ai terminé ma mouraja’a'}</div>
        <p class="finhint">${fin?'Bravo, ta journée est faite.':'Touche chaque rond quand la partie est faite : le bouton s’allume tout seul.'}</p>`;
    }
  }
  if(nLearned){
    h+=`<section class="overview"><h3>Toute la semaine</h3>`+plan.map((d,i)=>{
      const wd=i, dt=addDays(monday,wd);
      const txt=[shortBlock(d.block)||'Rien au programme'].concat(d.reinf.length?['+ '+d.reinf.length+' à revoir (fragiles)']:[]).join(' · ');
      return `<button class="ov" data-act="day" data-d="${wd}" aria-pressed="${selDay===wd}"><span class="d">${DAYS_SHORT[wd]} ${dt.getDate()}</span><span class="s">${esc(txt)}</span><span class="c">${dayComplete(pk,wd,d)?'✓':''}</span></button>`;
    }).join('')+`</section>`;
  }
  return h;
}

const BACKUP_DAYS=10;
function isStandalone(){
  try{ return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true; }catch(e){ return false; }
}
function installDismissed(){ try{ return !!localStorage.getItem('suivi-install-ok'); }catch(e){ return false; } }
function backupDue(){
  if(sync==='online'||!hasData(state)) return false;
  const ref=state.backupAt||state.createdAt; if(!ref) return false;
  return Date.now()-ref>BACKUP_DAYS*86400000;
}
function installSteps(){
  return `<ul class="steps"><li><b>iPhone (Safari) :</b> touche le bouton Partager (le carré avec la flèche), puis « Sur l’écran d’accueil ».</li>
    <li><b>Android (Chrome) :</b> touche les trois points en haut, puis « Ajouter à l’écran d’accueil » ou « Installer l’application ».</li></ul>`;
}
function noticesHTML(){
  let h='';
  if(backupDue()) h+=`<div class="notice"><p><b>Pense à sauvegarder ton suivi.</b> La dernière sauvegarde date de plus de ${BACKUP_DAYS} jours.</p>
    <div class="row2"><button class="btn primary" data-act="backupfile">Sauvegarder maintenant</button></div></div>`;
  if(sync!=='online'&&hasData(state)&&!isStandalone()&&!installDismissed()) h+=`<div class="notice"><p><b>Pour ne rien perdre, ajoute l’appli à ton écran d’accueil.</b> Ton suivi est alors protégé contre l’effacement automatique du navigateur.</p>

}
function backupName(){ const d=new Date(); const z=n=>('0'+n).slice(-2); return 'suivi-coran-'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json'; }
function markBackedUp(){ state.backupAt=Date.now(); save(); }
function doRestore(text){
  try{
    const o=JSON.parse(text);
    if(!o||typeof o!=='object'||!o.profiles) throw new Error('x');
    const n=sanitize(o);
    if(!n.order.length) throw new Error('vide');
    state=n; state.backupAt=Date.now(); backupText=''; save(); flash='Sauvegarde restaurée.';
    if(!state.profiles[pk]) screen='home';
  }catch(e){ flash='Ce fichier ou ce code n’est pas valide.'; }
  render();
}

function loadInfo(P,N){
  const R=state.settings.res; let eff=0;
  itemsFor(pk).forEach(it=>{ if(!P.marks[it.id]) return; const l=levelOf(P,it.sn); if(l==='x') return; eff+=itemW(it)*(l==='r'?1/R:l==='p'?2:1); });
  if(!eff) return '';
  const per=eff/N, txt=per<1?'moins d’une page':'environ '+Math.round(per)+(Math.round(per)>1?' pages':' page');
  const heavy=per>10;
  return `<p class="loopload${heavy?' heavy':''}"><b>Avec ${N} jours, tu révises ${txt} par jour</b>, plus les passages à consolider.${heavy?' C’est beaucoup : tu peux allonger la boucle ou mettre certaines sourates en résiduel.':''}</p>`;
}

let vp=null;      // {p, n}
/* Les pages sont rangées par groupes de quatre (deux feuilles du PDF, deux pages par feuille) dans pages/qNNN.jpg.
   La feuille s contient la page 2s-1 à droite et la page 2s à gauche ; la feuille impaire est en haut du fichier. */

}
function pageBox(p){
  const sp=Math.ceil(p/2), row=(sp%2===1)?0:1;

}

/* ---------- Choix d'une sourate ---------- */
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9؀-ۿ]/g,''); }
function juzPages(j){ return SUR[j.from-1].p+'–'+lastPage(j.to); }
function pickRows(q){
  const tracked=new Set(trackedFor(pk,state.profiles[pk].extra));
  const raw=q.trim(), nq=norm(raw);
  const num=/^\d+$/.test(raw)?+raw:0;
  const list=SUR.filter(s=>!tracked.has(s.n)).filter(s=>{
    if(!raw) return true;
    if(num) return s.n===num;
    return norm(s.fr).indexOf(nq)>=0||s.ar.indexOf(raw)>=0;
  });
  const jl=JUZ.filter(j=>juzRange(j).some(n=>!tracked.has(n))).filter(j=>{
    if(!raw) return true;
    if(num) return j.num===num;
    return norm('juz '+j.fr).indexOf(nq)>=0||j.ar.indexOf(raw)>=0;
  });
  if(!list.length&&!jl.length) return `<li class="none">Aucune sourate ne correspond.</li>`;
  let h='';
  if(jl.length){
    h+=`<li class="ph">Juzz entiers</li>`+jl.map(j=>{
      const miss=juzRange(j).filter(n=>!tracked.has(n)).length;
      return `<li><button class="row pick" data-act="addjuz" data-j="${j.id}"><span class="sw" aria-hidden="true">${j.num}</span>
        <span class="tx"><b>${esc(j.fr)}</b><span>${miss} sourates · pages ${juzPages(j)} · sourate par sourate</span></span><span class="ar" lang="ar">${j.ar}</span></button></li>`;
    }).join('');
  }
  if(list.length){
    h+=`<li class="ph">Sourates</li>`+list.map(s=>{
      const len=span(s.n);
      const info=modeOf(s.n)==='pages'?`Page ${s.p} · ${len} pages · suivie page par page`:`Page ${s.p} · ${len>1?len+' pages':'1 page'} · sourate entière`;
      return `<li><button class="row pick" data-act="addsur" data-n="${s.n}"><span class="sw" aria-hidden="true">${s.n}</span>
        <span class="tx"><b>${esc(s.fr)}</b><span>${info}</span></span><span class="ar" lang="ar">${s.ar}</span></button></li>`;
    }).join('');
  }
  return h;
}

/* ---------- Actions ---------- */
function paint(ids,st){
  st=st||brush;
  const marks=state.profiles[pk].marks, ch=[];
  ids.forEach(id=>{
    const prev=marks[id]||'n';
    if(prev===st) return;
    const P=state.profiles[pk]; P.fresh=P.fresh||{};
    ch.push([id,prev,P.fresh[id]||0]);
    if(st==='n') delete marks[id]; else marks[id]=st;
    if(st==='b') P.fresh[id]=Date.now(); else delete P.fresh[id];
  });
  if(ch.length){ history.push({pk:pk,ch:ch}); if(history.length>60) history.shift(); save(); }
  return ch.length;
}
function toggleDone(sec){
  const wk=wkKey(mondayOf(new Date())), done=state.profiles[pk].done;
  done[wk]=done[wk]||{};
  const d=done[wk][selDay]=done[wk][selDay]||{b:0,r:0,p:0};
  if(sec==='all'){ const v=(d.b&&d.r)?0:1; d.b=v; d.r=v; d.p=v; }
  else d[sec]=d[sec]?0:1;
  save();
}
function resetUI(){ flash=''; confirmReset=false; confirmDel=false; confirmJuz=''; confirmRem=0; openRange=0; backupText=''; }
const handlers={
  open(el){ go(()=>{ pk=el.dataset.pk; screen='profile'; tab=(main==='plan')?'plan':'suivi'; history=[]; resetUI(); selDay=todayWd(); openAcc=new Set(state.profiles[pk].extra.length?[]:['juz30']); }); },
  acc(el){ const k=el.dataset.k; if(openAcc.has(k)) openAcc.delete(k); else openAcc.add(k); render(); },
  back(){ hideViewer(); hidePicker(); hideCreator(); go(()=>{ if(tab==='reglages'&&screen==='profile'){ tab='suivi'; resetUI(); return; } if(tab==='loop'&&screen==='profile'){ tab='plan'; resetUI(); return; } screen='home'; history=[]; resetUI(); }); },
  tab(el){ go(()=>{ const t=el.dataset.tab; resetUI(); if(t==='muta'){ main='muta'; return; } if(t==='plan'){ main='plan'; tab='plan'; } else if(t==='reglages'){ main='suivi'; tab='reglages'; } else { main='suivi'; tab='suivi'; } }); },
  brush(el){ brush=el.dataset.st; render(); },
  loop(){ go(()=>{ tab='loop'; resetUI(); }); },
  setloop(){
    const P=state.profiles[pk], inp=document.getElementById('lpn'), sel=document.getElementById('lcd'), st=document.getElementById('lst');
    const v=Math.round(+(inp?inp.value:0)), cd=sel&&sel.value!==''&&+sel.value>=0?Math.round(+sel.value):null;
    const mode=st?st.value:'today';
    if(!(v>=3&&v<=60)){ flash='Choisis un nombre de jours entre 3 et 60.'; render(); return; }
    P.loop.n=v; if(cd==null) delete P.loop.cd; else P.loop.cd=cd;
    const t=new Date(), t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    let back=0;
    if(mode==='after'&&cd!=null){ const w0=(cd+1)%7; back=(((t.getDay()+6)%7)-w0+7)%7; }
    P.loop.start=wkKey(addDays(t0,-back));
    save();
    flash='Enregistré : boucle de '+v+' jours'+(cd==null?'':', cours le '+DAYS_LONG[cd])+(back===0?'. Aujourd’hui est le jour 1.':'. Elle a commencé le lendemain de ton cours.');
    render();
  },
  restartloop(){
    const P=state.profiles[pk], t=new Date();
    P.loop.start=wkKey(new Date(t.getFullYear(),t.getMonth(),t.getDate()));
    save(); flash='Boucle recommencée : aujourd’hui est le jour 1.'; render();
  },
  level(el){
    const P=state.profiles[pk], n=+el.dataset.n, l=el.dataset.l; flash='';

  leveljuz(el){

  paint(el){ flash=''; paint([el.dataset.id]); render(); },

  alljuz(el){ const j=JUZ.find(x=>x.id===el.dataset.j); if(!j) return; flash=''; paint(itemsFor(pk).filter(i=>i.kind==='s'&&i.n>=j.from&&i.n<=j.to).map(i=>i.id)); render(); },
  day(el){ selDay=+el.dataset.d; render(); if(el.classList.contains('ov')) window.scrollTo(0,0); },
  done(el){ toggleDone(el.dataset.sec); render(); },

  },
  copy(){

    const fallback=()=>{ if(ta){ ta.focus(); ta.select(); } flash='Code sélectionné : copie-le avec ton clavier.'; render(); };
    try{
      navigator.clipboard.writeText(txt).then(()=>{ flash='Code copié.'; render(); },fallback);
    }catch(e){ fallback(); }
  },
  restore(){

  restorepick(){ const f=document.getElementById('bkfile'); if(f) f.click(); },
  installok(){ try{ localStorage.setItem('suivi-install-ok','1'); }catch(e){} render(); },
  backupfile(){
    const text=exportText(), name=backupName();
    const done=m=>{ markBackedUp(); flash=m; render(); };
    let file=null;
    try{ file=new File([text],name,{type:'application/json'}); }catch(e){}
    const download=()=>{
      try{
        const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
        const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
        done('Fichier enregistré dans tes téléchargements.');
      }catch(e){ flash='Impossible de créer le fichier. Utilise le code à copier.'; render(); }
    };
    try{
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Sauvegarde Suivi du Coran'}).then(()=>done('Sauvegarde envoyée.'),err=>{ if(err&&err.name!=='AbortError') download(); });
        return;
      }
    }catch(e){}

  },
  'reset-ask'(){ confirmReset=true; render(); },

  newadult(){ showCreator('adult'); },

  avpick(el){

  },

    if(state.order.length>=MAX_PROFILES) return;

  }
};

ise conformément à la bienséance, ou la libération avec gentillesse. Et il ne vous est pas permis de reprendre quoi que ce soit de ce que vous leur aviez donné, - à moins que tous deux ne craignent de ne point pouvoir se conformer aux ordres imposés par Allah. Si donc vous craignez que tous deux ne puissent se conformer aux ordres d'Allah, alors ils ne commettent aucun péché si la femme se rachète avec quelque bien. Voilà les ordres d'Allah. Ne les transgressez donc pas. Et ceux qui transgressent les ordres d'Allah ceux-là sont les injustes","tj":[[1,2,"gr"],[5,8,"m2"],[32,38,"gh"],[60,66,"gh"],[70,73,"m2"],[73,79,"gh"],[100,104,"gh"],[111,113,"gr"],[116,119,"gh"],[119,121,"m45"],[136,139,"gh"],[154,156,"m45"],[159,163,"gh"],[168,170,"m45"],[195,196,"gr"],[244,245,"gr"],[285,286,"gr"],[299,301,"m2"],[317,318,"gr"],[349,353,"gh"],[369,370,"gr"],[381,383,"gr"],[385,388,"m45"],[398,399,"gr"],[399,400,"gr"],[403,405,"m2"],[409,410,"m246"]]},{"n":230,"p":36,"j":2,"h":4,"w":["فَإِن","طَلَّقَهَا","فَلَا","تَحِلُّ","لَهُۥ","مِنۢ","بَعۡدُ","حَتَّىٰ","تَنكِحَ","زَوۡجًا","غَيۡرَهُۥۗ","فَإِن","طَلَّقَهَا","فَلَا","جُنَاحَ","عَلَيۡهِمَآ","أَن","يَتَرَاجَعَآ","إِن","ظَنَّآ","أَن","يُقِيمَا","حُدُودَ","ٱللَّهِۗ","وَتِلۡكَ","حُدُودُ","ٱللَّهِ","يُبَيِّنُهَا","لِقَوۡمٖ","يَعۡلَمُونَ"],"fr":"S'il divorce avec elle (la troisième fois) alors elle ne lui sera plus licite tant qu'elle n'aura pas épousé un autre. Et si ce (dernier) la répudie alors les deux ne commettent aucun péché en reprenant la vie commune, pourvu qu'ils pensent pouvoir tous deux se conformer aux ordres d'Allah. Voilà les ordres d'Allah, qu'Il expose aux gens qui comprennent","tj":[[4,8,"gh"],[35,36,"m2"],[39,44,"gh"],[59,62,"gh"],[81,83,"m2"],[88,92,"gh"],[125,127,"m45"],[130,134,"gh"],[143,145,"m45"],[148,152,"gh"],[152,155,"gh"],[155,157,"m45"],[160,164,"gh"],[179,180,"gr"],[205,206,"gr"],[232,237,"gh"],[243,244,"m246"]]},{"n":231,"p":37,"j":2,"h":4,"w":["وَإِذَا","طَلَّقۡتُمُ","ٱلنِّسَآءَ","فَبَلَغۡنَ","أَجَلَ const CHAIN = new Set([82013, 83022, 82017, 82018, 89006, 105001, 90004, 95004]);
function nxtInline(v){
  if(SEC!=='amma' || !CHAIN.has(v.n)) return '';
  const nv = byN[v.n+1];
  const ar = String(v.a).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function vshort(v){ return SEC==='amma' ? v.s+':'+v.a : 'v. '+v.n; }
const DROP = /[ً-ٰٟۖ-ۭـ࣓-ࣿ۝]/g;
function skel(t){
  t = String(t).replace(DROP,'');
  t = t.replace(/[ٱأإآ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ء/g,'');
  t = t.replace(/(^|\s)يا\s+(?=\S)/g,'$1يا');   /* « يا أيها » se dit en deux mots mais s'écrit en un seul dans le mushaf */
  t = t.replace(/ا/g,'');
  t = t.replace(/(صل|زك|حي|نج|غد)وه/g,'$1ه').replace(/لربو(?=\s|$)/g,'لرب');
  t = t.replace(/[^ء-ي\s]/g,' ').replace(/\s+/g,' ').trim();
  return t;
}
function tri(s){const r=new Set();for(let i=0;i+3<=s.length;i++)r.add(s.substr(i,3));return r}
function nWords(v,sp){return v.w.slice(sp[0],sp[1]+1).join(' ')}
function prepSec(){ byN = {}; V.forEach(v=>{byN[v.n]=v;if(!v.sk){v.sk=skel(v.w.join(' '));v.tr=tri(v.sk);v.sw=[];v.w.forEach((w,i)=>{const k=skel(w);if(k)v.sw.push({k,i})})}}); }
/* recherche mot à mot : tous les versets qui contiennent exactement la suite de mots récitée */
function findSeq(seq){
  const res = [], L = seq.length;
  for(const v of V){
    const a = v.sw;
    for(let s=0;s+L<=a.length;s++){
      let ok = true;
      for(let j=0;j<L;j++){ if(a[s+j].k!==seq[j]){ ok=false; break; } }
      if(ok){ res.push({v, sp:[a[s].i, a[s+L-1].i]}); break; }
    }
  }
  return res;
}
/* expressions gardées : une suite de mots qui revient dans plusieurs versets n'est montrée que si elle fait partie d'une fiche */
let keptRuns = null;
function buildKept(){
  keptRuns = [];
  allGroups().forEach(g=>{ const o = g.occ.find(x=>x.sp.length); if(!o) return;
    const v = byN[o.v]; const run = v.sw.filter(x=>x.i>=o.sp[0][0] && x.i<=o.sp[0][1]).map(x=>x.k).join(' ');
    keptRuns.push({run:' '+run+' ', vs:g.vs}); });
}
function inKept(seq, res){
  if(!keptRuns) buildKept();
  const k = ' '+seq.join(' ')+' ';
  return keptRuns.some(r=>r.run.includes(k) && res.every(m=>r.vs.has(m.v.n)));
}
function recite(q){
  const toks = skel(q).split(' ').filter(Boolean);
  if(toks.length<2) return null;
  for(let L=toks.length; L>=2; L--){
    let best = null, any = false;
    for(let s=0;s+L<=toks.length;s++){
      const seq = toks.slice(s,s+L);
      const r = findSeq(seq);
      if(!r.length) continue;
      any = true;
      if(r.length>=2 && !inKept(seq, r)) continue;
      if(!best || r.length>best.res.length) best = {res:r, s, L, n:toks.length};
    }
    if(best) return best;
    if(any) return null;
  }
  return null;
}
function toLatin(s){return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}
function searchVerses(q){
  const sk = skel(q);
  if(sk.replace(/\s/g,'').length < 3) return null;
  const qa = []; for(let i=0;i+3<=sk.length;i++) qa.push(sk.substr(i,3));
  const qt = new Set(qa); if(!qt.size) return null;
  const out = [];
  for(const v of V){
    let c = 0; qt.forEach(t=>{ if(v.tr.has(t)) c++ });
    let run = 0, best = 0; qa.forEach(t=>{ if(v.tr.has(t)){ run++; if(run>best) best=run; } else run = 0; });
    let sc = 0.4*c/qt.size + 0.6*best/qa.length;
    if(v.sk.includes(sk)) sc = 1;
    if(sc >= 0.55) out.push({v, sc});
  }
  out.sort((a,b)=>b.sc-a.sc || a.v.n-b.v.n);
  return out.slice(0,6);
}
function commonRun(ns){
  const ws = ns.map(n=>byN[n].w.map(x=>skel(x)).filter(Boolean));
  const idx = ns.map(n=>{const m=[];byN[n].w.forEach((x,i)=>{if(skel(x))m.push(i)});return m});
  let base = 0; ws.forEach((w,i)=>{if(w.length<ws[base].length)base=i});
  for(let len=ws[base].length; len>=2; len--){
    for(let s=0;s+len<=ws[base].length;s++){
      const key = ws[base].slice(s,s+len).join(' ');
      const spans = [];
      let ok = true;
      for(let i=0;i<ws.length;i++){
        let found = -1;
        for(let k=0;k+len<=ws[i].length;k++){ if(ws[i].slice(k,k+len).join(' ')===key){found=k;break} }
        if(found<0){ok=false;break}
        spans.push([idx[i][found], idx[i][found+len-1]]);
      }
      if(ok) return {nw:len, spans};
    }
  }
  return null;
}

function offs(v){ if(v._o) return v._o; let o=0; v._o=v.w.map(w=>{ const r=o; o+=w.length+1; return r; }); return v._o; }

/* tafkhim (bleu foncé) : lettres d'isti'la (خ ص ض غ ط ق ظ), ر mufakhkhama, lam du nom « Allah » après fatha ou damma */
const TF_MK=/[ؐ-ًؚ-ٰٟۖ-ۭ]/, TF_ISTI='خصضغطقظ';
function tfGroups(w){ const g=[]; let i=0; while(i<w.length){ let j=i+1; while(j<w.length && TF_MK.test(w[j])) j++; g.push({b:w[i],m:w.slice(i+1,j),i,e:j}); i=j; } return g; }
function tfVow(m){ if(/[ّ]/.test(m) && /[ًٌَُٰٗٞ]/.test(m)) return 'f'; if(/[ًٌَُٰٗٞ]/.test(m)) return 'f'; if(/[ٍِٖ]/.test(m)) return 'k'; if(/[ْۡ]/.test(m)) return 's'; return ''; }
function tfLastVow(w){ const g=tfGroups(w); for(let k=g.length-1;k>=0;k--){ const v=tfVow(g[k].m); if(v==='f'||v==='k') return v; if(v==='s' && 'وا'.indexOf(g[k].b)<0) continue; } return 'f'; }
function tfMask(w, prevW){
  const g=tfGroups(w), mask=[]; const pw = prevW==null ? 'f' : tfLastVow(prevW);
  g.forEach((x,k)=>{
    let on=false;

    else if(x.b==='ر'){
      const v=tfVow(x.m);
      if(v==='f') on=true;
      else if(v!=='k'){
        const pv = k>0 ? g[k-1] : null;
        const p = pv ? (pv.b==='ي'&&tfVow(pv.m)!=='f'&&tfVow(pv.m)!=='k' ? 'k' : (pv.b==='و'||pv.b==='ا') && !/[َُِ]/.test(pv.m) ? 'f' : tfVow(pv.m)) : pw;
        if(p==='f') on=true;
        else if(p==='k'){ const nx=g[k+1]; if(nx && TF_ISTI.indexOf(nx.b)>=0) on=true; }
      }
    } else if(x.b==='ل' && /ّ/.test(x.m) && g[k+1] && g[k+1].b==='ه'){
      let c=k-1; while(c>=0 && g[c].b==='ل' && !tfVow(g[c].m)) c--;
      let ctx;
      if(c>=0 && g[c].b==='ٱ') ctx = c>0 ? tfVow(g[c-1].m) : pw;
      else if(c>=0) ctx = tfVow(g[c].m);
      else ctx = pw;
      on = ctx!=='k';
    }
    if(on) for(let t=x.i;t<x.e;t++) mask[t]=1;
  });
  return mask;
}
function tfEsc(w, a, b, mask){
  let out='', t=a;
  const g=tfGroups(w);
  while(t<b){
    if(mask[t]){ let u=t; while(u<b && mask[u]) u++; out+='<i class="t-tf">'+esc(w.slice(t,u))+'</i>'; t=u; }
    else { let u=t; while(u<b && !mask[u]) u++; out+=esc(w.slice(t,u)); t=u; }
  }
  return out;
}
function hlTj(c, str){
  if(c!=='gh') return '<i class="t-'+c+'">'+esc(str)+'</i>';
  const MARK=/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/, TAN=/[\u064B-\u064D\u0656\u0657\u065E]/;
  let out='', i=0;
  while(i<str.length){
    let j=i+1; while(j<str.length && MARK.test(str[j])) j++;
    const g=str.slice(i,j), b=str[i];
    if(b==='\u0646' || b==='\u0645') out+='<i class="t-gh">'+esc(g)+'</i>';
    else {
      let r='', k=0;
      for(const ch of g){ r += (k>0 && TAN.test(ch)) ? '<i class="t-gh">'+esc(ch)+'</i>' : esc(ch); k++; }
      out+=r;
    }
    i=j;
  }
  return out;
}
function wh(v, i, j){
  if(!S.tj) return esc(v.w.slice(i,j).join(' '));
  const TJ = v.tj || [];
  const o = offs(v); let out = [];
  for(let k=i;k<j;k++){
    const w = v.w[k], s0 = o[k], e0 = s0 + w.length; let cur = s0, h = ''; const mk = tfMask(w, k>0 ? v.w[k-1] : null);
    TJ.forEach(([a,b,c])=>{
      if(b<=s0 || a>=e0) return;
      const x = Math.max(a,s0), y = Math.min(b,e0);
      if(x<cur) return;
      if(x>cur) h += tfEsc(w, cur-s0, x-s0, mk);
      h += hlTj(c, w.slice(x-s0, y-s0)); cur = y;
    });
    if(cur<e0) h += tfEsc(w, cur-s0, w.length, mk);
    out.push(h);
  }
  return out.join(' ');
}
function verseHTML(v, sp, a, b){
  const mark = new Array(v.w.length).fill(0);
  sp.forEach(([s,e])=>{ for(let i=s;i<=e;i++) mark[i]=1; });
  sp.forEach(([s,e])=>{ if(s>0 && !mark[s-1]) mark[s-1]=2; if(e<v.w.length-1 && !mark[e+1]) mark[e+1]=2; });
  if(a===undefined){ a=0; b=v.w.length-1; }
  let out = '', i = a;
  while(i<=b){
    if(mark[i]===1){
      let j=i; while(j<=b && mark[j]===1) j++;
      out += '<span class="s">'+wh(v,i,j)+'</span> '; i=j;
    } else if(mark[i]===2){ out += '<span class="p">'+wh(v,i,i+1)+'</span> '; i++; }
    else { out += wh(v,i,i+1)+' '; i++; }
  }
  return out.trim();
}
/* extrait : l'expression commune avec quelques mots autour, « … » là où le verset continue */
function excerptHTML(v, sp){
  const n = v.w.length;
  const a = Math.max(0, Math.min(...sp.map(x=>x[0])) - 2), b = Math.min(n-1, Math.max(...sp.map(x=>x[1])) + 3);
  if(a===0 && b===n-1) return verseHTML(v, sp);
  return (a>0?'<span class="el">… </span>':'')+verseHTML(v, sp, a, b)+(b<n-1?'<span class="el"> …</span>':'');
}
function position(g){
  const r = g.occ.filter(o=>o.sp.length);
  if(!r.length) return '';
  const st = r.every(o=>o.sp[0][0]===0), en = r.every(o=>o.sp[o.sp.length-1][1]===byN[o.v].w.length-1);
  if(st&&en) return 'verset entier';
  if(st) return 'début commun';
  if(en) return 'fin commune';
  return 'au milieu du verset';
}
function ficheHTML(g, fN){
  const first = g.occ.find(o=>o.sp.length);
  const phrase = first ? nWords(byN[first.v], first.sp[0]) : '';
  const k = esc(g.key);
  let h = '<article class="fiche'+(fN&&g.vs.has(fN)?' hit':'')+'" data-k="'+k+'">';
  h += '<div class="hub">';
  h += '<button class="star" data-act="star" aria-pressed="'+(!!S.star[g.key])+'" aria-label="Marquer à revoir" title="À revoir">'+(S.star[g.key]?'★':'☆')+'</button>';
  h += '<div style="min-width:0;flex:1;text-align:right">';
  if(g.custom && g.title) h += '<div class="note-l">'+esc(g.title)+'</div>';
  const occs = g.occ.filter(o=>o.sp.length);
  const startAll = occs.every(o=>o.sp[0][0]===0), endAll = occs.every(o=>o.sp[o.sp.length-1][1]===byN[o.v].w.length-1);
  h += '<p class="phrase" lang="ar">'+(startAll?'':'<span class="el">… </span>')+esc(phrase||'—')+(endAll?'':'<span class="el"> …</span>')+'</p></div></div>';
  if(g.custom) h += '<div class="badges"><span class="badge">ma fiche</span></div>';
  h += '<div class="tree">';
  g.occ.forEach(o=>{
    const v = byN[o.v];
    const ex = verseHTML(v, o.sp)+nxtInline(v), fu = ex;
    h += '<div class="node'+(fN===o.v?' me':'')+(ex===fu?' nofull':'')+'"><div class="ometa"><b>'+vlabel(v)+'</b><span>page '+v.p+'</span>'+hz(v)+''+(fN===o.v?'<span>verset reconnu</span>':'')+'</div>';
    h += '<p class="vt vex" lang="ar">'+ex+'</p>';
    if(ex!==fu) h += '<p class="vt vfu" lang="ar">'+fu+'</p>';
    if(S.tr) h += '<p class="fr">'+esc(v.fr)+'</p>';
    h += '</div>';
  });
  h += '</div>';
  if(g.custom && g.cnote) h += '<p class="fr"><b>Astuce :</b> '+esc(g.cnote)+'</p>';
  if(g.custom) h += '<div class="rowx"><button class="link danger" data-act="del">Supprimer cette fiche</button></div>';
  return h+'</article>';
}
function passes(g){
  if(filter==='long') return g.nw>=4;
  if(filter==='star') return !!S.star[g.key];
  if(filter==='mine') return !!g.custom;
  return true;
}
function render(){
  const q = $('q').value.trim();
  const out = $('out');
  let h = '';
  const groups = allGroups();
  if(!q){
    const list = groups.filter(passes);
    h += '<div class="count">'+list.length+' fiche'+(list.length>1?'s':'')+' · ordre du mushaf</div>';
    h += list.length ? list.map(g=>ficheHTML(g,null)).join('') :
      '<div class="empty">Rien à afficher avec ce filtre.'+(filter==='star'?' Appuie sur ☆ dans une fiche pour la retrouver ici.':'')+'</div>';
    out.innerHTML = h; return;
  }
  const d = toLatin(q).trim();
  const pm = d.match(/^(?:p|page|ص|صفحة)\s*(\d{1,3})$/i);
  if(pm){
    const p = +pm[1];
    const list = groups.filter(g=>[...g.vs].some(n=>byN[n]&&byN[n].p===p)).filter(passes);
    h += '<div class="count">Page '+p+' : '+list.length+' fiche'+(list.length>1?'s':'')+'</div>';
    h += list.length ? list.map(g=>ficheHTML(g,null)).join('') : '<div class="empty">Aucune fiche sur la page '+p+'.</div>';
    out.innerHTML = h; return;
  }
  let cands, ex = null;
  if(/^\d{1,3}$/.test(d) || (SEC==='amma' && /^\d{1,3}\s*[:.\/\-\s]\s*\d{1,3}$/.test(d))){
    const v = numLookup(d);
    cands = v ? [{v, sc:1, num:true}] : [];
  } else {
    cands = searchVerses(q);
    ex = recite(q);
    /* récitation un peu fausse : si un verset ressemble très fort à tout ce qui a été dit, on le préfère à une correspondance partielle */
    if(ex && ex.L<ex.n && cands && cands.length && cands[0].sc>=0.8) ex = null;
  }
  if(ex){
    const ms = ex.res;
    if(!focusN || !ms.some(m=>m.v.n===focusN)) focusN = ms[0].v.n;
    const m0 = ms.find(m=>m.v.n===focusN);
    const phrase = nWords(m0.v, m0.sp);
    if(ex.L<ex.n) h += '<div class="msg">J\'ai retrouvé <b>'+ex.L+' mots sur '+ex.n+'</b> dans ce que tu as dit. Corrige le texte si un mot est faux.</div>';
    if(ms.length>=2){
      const shown = ms.slice(0,12);
      h += '<article class="card hit"><div class="note-l">Mutashabihat de ce que tu as récité</div>';
      h += '<p class="phrase" lang="ar">'+esc(phrase)+'</p>';
      
      shown.forEach(m=>{
        h += '<div class="occ"><div class="ometa"><b>'+vlabel(m.v)+'</b><span>page '+m.v.p+'</span>'+hz(m.v)+'</div>';
        h += '<p class="vt" lang="ar">'+verseHTML(m.v, [m.sp])+'</p>';
        if(S.tr) h += '<p class="fr">'+esc(m.v.fr)+'</p>';
        h += '</div>';
      });
      if(ms.length>shown.length) h += '<p class="fr">Et '+(ms.length-shown.length)+' autres versets. Récite quelques mots de plus pour préciser.</p>';
      h += '</article>';
      if(ms.length<=12){
        h += '<div class="note-l">Voir les fiches d\'un de ces versets</div><div class="cands">';
        ms.forEach(m=>{ h += '<button class="cand" data-act="cand" data-n="'+m.v.n+'" aria-pressed="'+(m.v.n===focusN)+'\">'+vshort(m.v)+' <small>p. '+m.v.p+'</small></button>'; });
        h += '</div>';
      }
    } else {
      h += '<article class="card hit"><div class="msg" style="margin:0"><b>Ce passage n\'apparaît que dans le verset '+vnum(m0.v)+'.</b> Voici ses autres mutashabihat.</div>';
      h += '<div class="ometa"><b>'+vlabel(m0.v)+'</b><span>page '+m0.v.p+'</span>'+hz(m0.v)+'</div>';
      h += '<p class="vt" lang="ar">'+verseHTML(m0.v, [m0.sp])+'</p>'+(S.tr?'<p class="fr">'+esc(m0.v.fr)+'</p>':'')+'</article>';
    }
    const all = groups.filter(g=>g.vs.has(focusN));
    const overlap = g => { const o = g.occ.find(x=>x.v===focusN); return o && o.sp.some(([s,e])=>s<=m0.sp[1] && e>=m0.sp[0]) ? 0 : 1; };
    all.sort((a,b)=>overlap(a)-overlap(b));
    const lst = all.filter(passes);
    if(!all.length) h += '<div class="empty">Pas de fiche enregistrée pour le verset '+vnum(byN[focusN])+' : aucune expression de '+minW()+' mots ou plus de ce verset ne se retrouve ailleurs '+inTxt()+'.</div>';
    else {
      h += '<div class="count">'+all.length+' fiche'+(all.length>1?'s':'')+' pour le verset '+vnum(byN[focusN])+' · celles qui touchent à ce que tu as récité sont en premier'+(lst.length!==all.length?' ('+lst.length+' avec ce filtre)':'')+'</div>';
      h += lst.map(g=>ficheHTML(g,focusN)).join('');
    }
    out.innerHTML = h; return;
  }
  if(cands===null){ out.innerHTML = '<div class="empty">Tape ou récite au moins trois lettres.</div>'; return; }
  if(!cands.length){ out.innerHTML = '<div class="empty">Aucun verset ne ressemble à cette récitation. Essaie avec le début ou la fin du verset, ou corrige le texte reconnu.</div>'; return; }
  if(!focusN || !cands.some(c=>c.v.n===focusN)) focusN = cands[0].v.n;
  const cur = byN[focusN];
  if(cands.length>1){
    h += '<div class="note-l">Versets qui ressemblent à ce que tu as dit</div><div class="cands">';
    cands.forEach(c=>{ h += '<button class="cand" data-act="cand" data-n="'+c.v.n+'" aria-pressed="'+(c.v.n===focusN)+'\">'+vshort(c.v)+' <small>p. '+c.v.p+' · '+Math.round(c.sc*100)+' %</small></button>'; });
    h += '</div>';
  }
  const gs = groups.filter(g=>g.vs.has(focusN));
  h += '<article class="card hit"><div class="ometa"><b>'+vlabel(cur)+'</b><span>page '+cur.p+'</span>'+hz(cur)+'</div>';
  h += '<p class="vt" lang="ar">'+esc(cur.w.join(' '))+'</p>'+(S.tr?'<p class="fr">'+esc(cur.fr)+'</p>':'')+'</article>';
  const list = gs.filter(passes);
  if(!gs.length) h += '<div class="empty">Aucune expression de '+minW()+' mots ou plus de ce verset ne se retrouve ailleurs '+inTxt()+'.</div>';
  else {
    h += '<div class="count">'+gs.length+' fiche'+(gs.length>1?'s':'')+' contiennent le verset '+vnum(cur)+(list.length!==gs.length?' ('+list.length+' avec ce filtre)':'')+'</div>';
    h += list.map(g=>ficheHTML(g,focusN)).join('');
  }
  out.innerHTML = h;
}

/* ---------- micro (reconnaissance vocale du navigateur, gratuite) ---------- */
(function(){
  const btn = $('mic'), msg = $('micmsg');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function say(h){ msg.hidden = !h; msg.innerHTML = h || ''; }
  if(!SR){ btn.disabled = true; say('<b>Le micro n\'est pas disponible dans ce navigateur.</b> Sur téléphone, touche le micro du clavier arabe dans la barre de recherche : c\'est gratuit et ça marche pareil.'); return; }
  let rec = null, on = false;
  btn.addEventListener('click', ()=>{
    if(on){ rec && rec.stop(); return; }
    rec = new SR(); rec.lang = 'ar-SA'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onstart = ()=>{ on = true; btn.classList.add('rec'); btn.classList.remove('primary'); btn.textContent = '■ Arrêter'; say('Écoute en cours. Récite quelques mots du verset.'); };
    rec.onresult = ev=>{
      let t = ''; for(let i=0;i<ev.results.length;i++) t += ev.results[i][0].transcript;
      $('q').value = t; focusN = null; render();
    };
    rec.onerror = ev=>{
      const c = ev.error;
      if(c==='not-allowed'||c==='service-not-allowed') say('<b>Le micro est bloqué ici.</b> Autorise-le dans le navigateur, ou utilise le micro du clavier arabe de ton téléphone. Dans certaines fenêtres intégrées, il ne marche que sur la version hébergée de la page.');
      else if(c==='no-speech') say('Je n\'ai rien entendu. Rapproche-toi du micro et réessaie.');
      else if(c==='network') say('Le micro a besoin d\'une connexion internet.');
      else if(c!=='aborted') say('Le micro a eu un souci ('+esc(c)+'). Tu peux taper le verset à la place.');
    };
    rec.onend = ()=>{ on = false; btn.classList.remove('rec'); btn.classList.add('primary'); btn.textContent = '🎤 Réciter'; if(/Écoute en cours/.test(msg.textContent)) say(''); };
    try{ rec.start(); }catch(e){ say('Impossible de lancer le micro. Tape le verset à la place.'); }
  });
})();
